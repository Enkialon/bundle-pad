[package]
name = "bundlepad"
version = "0.1.0"
description = "轻量级单文档 Markdown 与 TextBundle 编辑器"
authors = ["BundlePad"]
edition = "2024"

[lib]
name = "bundlepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
base64 = "0.22.1"
dunce = "1.0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
