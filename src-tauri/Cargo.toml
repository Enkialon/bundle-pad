[package]
name = "bundlepad"
version = "0.0.3"
description = "轻量级单文档 Markdown 与 TextBundle 编辑器"
authors = ["BundlePad"]
edition = "2024"
default-run = "bundlepad"

[lib]
name = "bundlepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bundlepad-http"
path = "src/bin/http.rs"
required-features = ["http"]

[features]
http = ["dep:tiny_http", "dep:rfd"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
base64 = "0.22.1"
dunce = "1.0.5"
rfd = { version = "0.16.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tempfile = "3.27.0"
tiny_http = { version = "0.12.0", optional = true }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
