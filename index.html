<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BundlePad</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app">
      <header id="menubar" class="menubar"></header>
      <div class="workspace">
        <main id="editor" class="editor"></main>
        <textarea id="source" class="source" hidden spellcheck="false" aria-label="Markdown 源码"></textarea>
      </div>
      <footer class="statusbar">
        <button type="button" id="source-mode" class="status-source" aria-pressed="false">源码模式</button>
        <span id="status-state">已保存</span>
      </footer>
    </div>
  </body>
</html>
